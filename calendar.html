<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>カレンダー</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calendar">

        <!-- カレンダーのヘッダー -->
        <header class="calendar-header">

            <button id="prev-month">&lt;</button>

            <h1 id="current-month"></h1>

            <button id="next-month">&gt;</button>

            <button id="open-tutorial" class="tutorial-button" aria-label="使い方を見る" title="使い方を見る">
                ?
            </button>

        </header>


        <!-- 曜日 -->
        <div class="weekdays">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
        </div>


        <!-- 日付 -->
        <div id="calendar-days" class="calendar-days"></div>

    </main>


    <!-- 予定追加モーダル -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <button id="close-modal" class="close-button">
                ×
            </button>

            <h2>予定を追加</h2>

            <p id="selected-date"></p>

            <form id="event-form">

                <label for="event-title">
                    予定
                </label>

                <input
                    type="text"
                    id="event-title"
                    placeholder="例：数学の勉強"
                    required
                >


                <label for="event-time">
                    時間
                </label>

                <input
                    type="time"
                    id="event-time"
                >


                <button id="event-submit" type="submit">
                    追加
                </button>

            </form>

        </div>

    </div>


    <!-- インタラクティブチュートリアル -->
    <div id="tutorial" class="tutorial" aria-hidden="true">

        <div class="tutorial-card" role="dialog" aria-labelledby="tutorial-title" aria-describedby="tutorial-description">

            <div class="tutorial-progress" aria-label="チュートリアルの進行状況">
                <span id="tutorial-step-count"></span>
                <span id="tutorial-dots"></span>
            </div>

            <h2 id="tutorial-title"></h2>
            <p id="tutorial-description"></p>

            <div class="tutorial-actions">
                <button id="tutorial-skip" class="tutorial-skip">スキップ</button>
                <div>
                    <button id="tutorial-back" class="tutorial-back">戻る</button>
                    <button id="tutorial-next" class="tutorial-next">次へ</button>
                </div>
            </div>

        </div>

    </div>


    <script src="main.js"></script>

</body>
</html>
