<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放課後カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>

  <main class="board">
    <div class="chalk-frame">
      <p class="eyebrow">Homeroom Board</p>
      <h1 class="title">放課後<span class="title-sub">カレンダー</span></h1>
      <p class="lede">部活も、行事も、委員会の予定も。<br>放課後の「今日なに？」をひとつにまとめました。</p>

      <div class="button-row">
        <a class="btn btn-primary" href="calendar.html">
          <span class="btn-label">カレンダーを見る</span>
          <span class="btn-sub">今日の予定をチェック</span>
        </a>
        <a class="btn btn-secondary" href="howto.html">
          <span class="btn-label">使い方ガイド</span>
          <span class="btn-sub">はじめての人はこちら</span>
        </a>
      </div>
    </div>

    <div class="chalk-doodle" aria-hidden="true">
      <span class="doodle star">✦</span>
      <span class="doodle pin">📌</span>
      <span class="doodle note">✎</span>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">放課後カレンダー</p>
    <nav class="footer-links" aria-label="フッターナビゲーション">
      <a href="index.html">home</a>
      <a href="calendar.html">カレンダー</a>
      <a href="howto.html">使い方ガイド</a>
    </nav>
  </footer>
